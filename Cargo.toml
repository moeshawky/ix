[package]
name = "moeix"
version = "0.9.0"
edition = "2024"
description = "Sub-millisecond code search via sparse trigram indexing."
homepage = "https://github.com/moeshawky/ix"
documentation = "https://docs.rs/moeix"
license = "MIT"
repository = "https://github.com/moeshawky/ix"
readme = "README.md"
keywords = ["search", "trigram", "code-search", "indexing", "grep"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[workspace]
members = ["."]

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Whether to install an updater program
install-updater = true
repository = "https://github.com/moeshawky/ix"
# Path that installers should place binaries in
install-path = "CARGO_HOME"

[[bin]]
name = "ix"
path = "src/bin/ix.rs"

[[bin]]
name = "ixd"
path = "src/bin/ixd.rs"
required-features = ["notify"]

[lib]
name = "ix"
path = "src/lib/lib.rs"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["notify"]
notify = ["dep:notify"]
decompress = ["flate2", "bzip2", "xz2"]
archive = ["zip", "tar"]
full = ["decompress", "notify", "archive"]

[dependencies]
llmosafe = "0.6.1"
memmap2 = "0.9"
crc32c = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
regex = "1"
regex-syntax = "0.8"
ignore = "0.4"           # .gitignore support (same as ripgrep)
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crossbeam-channel = "0.5"
notify = { version = "7", optional = true }             # file watcher (inotify/kqueue/ReadDirectoryChanges)
ctrlc = "3.4"
nix = { version = "0.29", features = ["process", "signal"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
chrono = "0.4"
flate2 = { version = "1", optional = true }
zstd = { version = "0.13" }
bzip2 = { version = "0.5", optional = true }
xz2 = { version = "0.1", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
tar = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "search"
harness = false

[profile.release]
  lto = true
  codegen-units = 1
  strip = true
  panic = "abort"
  opt-level = "z"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Tier 3: Release profile optimizations
# panic and opt-level added to existing [profile.release] below

# MSRV verification
[workspace.package]
rust-version = "1.85"

# Build metadata for reproducibility
[workspace.metadata]
build.timestamp = "0"
