[package]
name = "moeix"
version = "0.13.3"
edition = "2024"
description = "Sub-millisecond code search via sparse trigram indexing."
homepage = "https://github.com/moeshawky/ix"
documentation = "https://docs.rs/moeix"
license = "MIT"
repository = "https://github.com/moeshawky/ix"
readme = "README.md"
keywords = ["search", "trigram", "code-search", "indexing", "grep"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
rust-version = "1.85"
# Agent/internal artifacts must never ship in the published crate.
# These were inadvertently included in v0.12.8 (AGENTS.md, SUBAGENT_ROLES.md,
# bugs/ reached crates.io). Keep them out of the package going forward.
exclude = [
    "AGENTS.md",
    "SUBAGENT_ROLES.md",
    "bugs/",
    ".moeinclude",
]

[workspace]
members = [".", "ix-py"]

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# Allow cargo-dist to run even when the generated release.yml differs from
# what this cargo-dist version would emit. The committed release.yml was
# hand-standardized (2026-06-10) and cargo-dist 0.31.0 flags it as "out of
# date"; this avoids the `plan` job failing with "out of date contents".
allow-dirty = [".github/workflows/release.yml"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Whether to install an updater program
install-updater = true
repository = "https://github.com/moeshawky/ix"
# Path that installers should place binaries in
install-path = "CARGO_HOME"

[[bin]]
name = "ix"
path = "src/bin/ix/main.rs"

[[bin]]
name = "ixd"
path = "src/bin/ixd.rs"
required-features = ["notify"]

[lib]
name = "ix"
path = "src/lib/lib.rs"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["notify"]
notify = ["dep:notify"]
decompress = ["flate2", "bzip2", "xz2"]
archive = ["zip", "tar"]
full = ["decompress", "notify", "archive"]

[dependencies]
llmosafe = "0.7.5"
memmap2 = "0.9"
crc32c = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
regex = "1"
regex-syntax = "0.8"
ignore = "0.4"           # .gitignore support (same as ripgrep)
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
crossbeam-channel = "0.5"
notify = { version = "7", optional = true }             # file watcher (inotify/kqueue/ReadDirectoryChanges)
ctrlc = "3.4"
nix = { version = "0.29", features = ["process", "signal"] }
libc = "0.2"
tracing = "0.1"
# NOTE: tracing-subscriber is declared but not initialized by the library.
# The daemon binary (ixd) should call tracing_subscriber::fmt::try_init()
# at startup to enable structured logging. Without this, all tracing::warn!
# and tracing::debug! calls silently discard output.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
chrono = "0.4"
flate2 = { version = "1", optional = true }
zstd = { version = "0.13" }
bzip2 = { version = "0.5", optional = true }
xz2 = { version = "0.1", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
tar = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
proptest = "1"
llmosafe = { version = "0.7.5", features = ["testing"] }

[[bench]]
name = "search"
harness = false

[profile.release]
  lto = true
  codegen-units = 1
  strip = true
  panic = "abort"
  opt-level = "z"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Tier 3: Release profile optimizations
# panic and opt-level added to existing [profile.release] below

[workspace.package]
rust-version = "1.85"

# Build metadata for reproducibility
[workspace.metadata]
build.timestamp = "0"
