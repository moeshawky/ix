[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSD-3-Clause",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = []

[advisories]
yanked = "deny"
ignore = [
    "RUSTSEC-2024-0384",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []