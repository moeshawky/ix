name: Tier 3 - Quality Verification

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_LOG: info

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rustfmt, clippy
          target: x86_64-unknown-linux-gnu

      - name: Install cargo tools
        run: |
          cargo install cargo-llvm-cov cargo-semver-checks cargo-udeps cargo-outdated cargo-deny

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets --all-features --exclude ix-py -- -D warnings

      - name: Tier 1 - Clippy lints
        run: |
          cargo clippy --workspace --all-targets --all-features --exclude ix-py -- \
            -D clippy::dbg_macro -D clippy::todo \
            -D clippy::wildcard_imports -D clippy::panic_in_result_fn \
            -D clippy::missing_const_for_fn -D clippy::large_enum_variant

      - name: Tier 2 - Supply chain
        run: cargo deny check licenses advisories bans

      - name: Build
        run: cargo build --workspace --all-features --exclude ix-py --verbose

      - name: Test
        run: cargo test --workspace --all-features --exclude ix-py

      - name: Coverage
        run: |
          cargo llvm-cov --all-features --workspace --exclude ix-py --lcov --output-path lcov.info
          cargo llvm-cov --all-features --workspace --exclude ix-py --summary-only

      - name: Outdated deps
        run: cargo outdated --exit-code 1 || echo "::warning::Some dependencies have newer versions available (major bumps require Cargo.toml changes)"

      - name: Upload coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: true

      - name: Deny report
        if: always()
        run: cargo deny --format json check licenses advisories bans > deny-report.json || true
