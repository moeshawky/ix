name: Rust
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --workspace --all-features --exclude ix-py --verbose
    - name: Run tests
      run: cargo test --workspace --all-features --exclude ix-py --verbose
    - name: Check minimal and optional feature builds
      run: |
        cargo check --no-default-features
        cargo check --no-default-features --features archive
    - name: Check Python extension without default features
      if: matrix.os == 'ubuntu-latest'
      run: cargo check --manifest-path ix-py/Cargo.toml --no-default-features
    - name: Run Clippy
      run: cargo clippy --workspace --all-targets --all-features --exclude ix-py -- -D warnings
    - name: Check Formatting
      run: cargo fmt -- --check