# ═══════════════════════════════════════════════════════════════════════════════
# MASTER: Unified Python Wheel Build + Publish (ix / sniper / llmosafe)
# ═══════════════════════════════════════════════════════════════════════════════
# This is the CANONICAL workflow. All three projects use identical copies.
# Only the PROJECT env var below differs. Do NOT diverge from this template.
#
# Canonical source: /workspace/.github/workflows/wheels.yml
# Local build:      /workspace/.github/scripts/build-wheels.sh
# Reference:        /workspace/PUBLISHING.md
#
# To adopt for a new project:
#   1. Copy this file to .github/workflows/wheels.yml
#   2. Change PROJECT below
#   3. Set up Trusted Publishing on pypi.org for the repo
#   4. Add a "pypi" environment in repo Settings > Environments
# ═══════════════════════════════════════════════════════════════════════════════

name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# ── Project identity (ONLY line that differs between projects) ──────────────
env:
  PROJECT: ix                          # ← CHANGE THIS: ix | sniper | llmosafe
  PYTHON_VERSION: "3.12"

# ── Concurrency: cancel in-progress on re-push ──────────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Linux wheels — all projects
  # ═══════════════════════════════════════════════════════════════════════════
  build-linux:
    name: linux (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
            pre-build: |
              yum install -y openssl-devel || true
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
            pre-build: |
              yum install -y gcc gcc-c++ make || true
              ln -sf /usr/bin/gcc /usr/bin/aarch64-linux-gnu-gcc || true

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PROJECT }}-py
          args: --release --out dist -i python${{ env.PYTHON_VERSION }}
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: ${{ matrix.pre-build }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: ${{ env.PROJECT }}-py/dist/

  # ═══════════════════════════════════════════════════════════════════════════
  # Windows wheels — ix only (skipped for sniper/llmosafe)
  # ═══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: windows (${{ matrix.target }})
    # NOTE: Always runs for ix. For sniper/llmosafe, either remove this
    # entire job or gate with github.repository check.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, i686]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PROJECT }}-py
          args: --release --out dist -i python${{ env.PYTHON_VERSION }}
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: ${{ env.PROJECT }}-py/dist/

  # ═══════════════════════════════════════════════════════════════════════════
  # Python verification gate — lint, type-check, and pytest before PyPI publish
  # ═══════════════════════════════════════════════════════════════════════════
  verify-python:
    name: verify python (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python QA tools
        run: python -m pip install --upgrade pip maturin ruff mypy pytest

      - name: Lint and typecheck Python package
        run: |
          ruff check --config ${{ env.PROJECT }}-py/pyproject.toml ${{ env.PROJECT }}-py/
          mypy --config-file ${{ env.PROJECT }}-py/pyproject.toml ${{ env.PROJECT }}-py/python/${{ env.PROJECT }}

      - name: Build native extension and run pytest
        run: |
          maturin develop --manifest-path ${{ env.PROJECT }}-py/Cargo.toml --release
          pytest ${{ env.PROJECT }}-py/tests/

  # ═══════════════════════════════════════════════════════════════════════════
  # Publish to PyPI — on tag push only (not manual dispatch by default)
  # ═══════════════════════════════════════════════════════════════════════════
  publish-pypi:
    name: Publish → PyPI
    needs: [build-linux, build-windows, verify-python]
    # Gate on OUR upstream build & verification jobs only (not a run-wide !failure()),
    # so an unrelated job failing does NOT skip the real PyPI publish on a tag push.
    if: |
      !cancelled() &&
      needs.build-linux.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.verify-python.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ env.PROJECT == 'ix' && 'moeix' || env.PROJECT == 'sniper' && 'moesniper' || 'llmosafe' }}
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
          attestations: false
          print-hash: true
