[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "ix"
version = "0.1.0"
description = "Python bindings for ix — sub-millisecond code search via sparse trigram indexing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ix contributors" }]
keywords = ["search", "trigram", "code-search", "indexing", "grep"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/moeshawky/ix"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "ix._ix"
python-source = "python"
manifest-path = "Cargo.toml"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "S", "C4", "RET", "PTH", "TC", "FA"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
