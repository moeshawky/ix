[package]
name = "ix-py"
version = "0.14.2"
edition = "2024"
description = "Python bindings for ix — sub-millisecond code search via sparse trigram indexing."
license = "MIT"
repository = "https://github.com/moeshawky/ix"
rust-version = "1.85"

[lib]
name = "_ix"
crate-type = ["cdylib"]

[dependencies]
ix = { version = "0.14.2", path = "..", default-features = false }
pyo3 = { version = "0.25", features = ["extension-module"] }
memmap2 = "0.9"
rayon = "1"
llmosafe = "0.7.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = ["notify"]
notify = ["ix/notify"]
archive = ["ix/archive"]
decompress = ["ix/decompress"]
full = ["notify", "archive", "decompress"]
