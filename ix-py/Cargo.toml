[package]
name = "ix-py"
version = "0.12.1"
edition = "2024"
description = "Python bindings for ix — sub-millisecond code search via sparse trigram indexing."
license = "MIT"
repository = "https://github.com/moeshawky/ix"
rust-version = "1.85"

[lib]
name = "_ix"
crate-type = ["cdylib"]

[dependencies]
moeix = { version = "0.12.1", path = "..", default-features = false, features = ["notify"] }
pyo3 = { version = "0.25", features = ["extension-module"] }
memmap2 = "0.9"
rayon = "1"
llmosafe = "0.7.3"

[features]
default = ["notify"]
notify = ["moeix/notify"]
archive = ["moeix/archive"]
decompress = ["moeix/decompress"]
full = ["notify", "archive", "decompress"]
